name: Build resistor release
on:
  push:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    name: Android logic, lint and unsigned release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Numeric tests
        run: |
          mkdir -p "$RUNNER_TEMP/resistor-core-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/resistor-core-tests" app/src/main/java/com/kaotickj/resistorcalculator/ResistorCore.java tests/CoreTest.java
          java -cp "$RUNNER_TEMP/resistor-core-tests" CoreTest
      - name: Lint and compile
        run: gradle --no-daemon :app:lint :app:assembleRelease
      - name: Verify and package unsigned APK
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"
          mkdir -p release
          cp "$APK" release/Resistor-Color-Code-3.0.0-android-unsigned.apk
          printf 'Source commit: %s\nVersion: 3.0.0\nVersion code: 2\nSigning: unsigned, requires authorized release signing\nPhysical-device testing: not performed\n' "$GITHUB_SHA" > release/BUILD-INFO.txt
          cd release
          sha256sum *.apk | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: resistor-android-unsigned
          path: android/release/*
          if-no-files-found: error
          retention-days: 7

  desktop-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Qt platform libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - name: Create source installer bundle
        run: python packaging/desktop/build_bundle.py
      - name: Install from extracted release archive
        run: |
          mkdir unpacked
          tar -xzf dist/ResistorCalculator-3.0.0-linux-x86_64-installer.tar.gz -C unpacked
          sh unpacked/ResistorCalculator-3.0.0/install.sh --target "$RUNNER_TEMP/Resistor Calculator 3.0.0"
      - name: Test installed application offscreen
        run: |
          export RESISTOR_SOURCE="$RUNNER_TEMP/Resistor Calculator 3.0.0/resistanceCalculator.py"
          "$RUNNER_TEMP/Resistor Calculator 3.0.0/.venv/bin/python" -m unittest discover -s tests -p 'test_desktop.py' -v
          test -f "$HOME/.local/share/applications/resistor-calculator.desktop"
      - name: Test uninstaller
        run: |
          sh "$RUNNER_TEMP/Resistor Calculator 3.0.0/uninstall.sh"
          test ! -d "$RUNNER_TEMP/Resistor Calculator 3.0.0"
          test ! -f "$HOME/.local/share/applications/resistor-calculator.desktop"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-installer
          path: dist/ResistorCalculator-3.0.0-linux-x86_64-installer.tar.gz
          if-no-files-found: error

  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Verify Windows Python launcher
        shell: pwsh
        run: |
          py -3.12 -c "import struct; assert struct.calcsize('P') == 8"
          if ($LASTEXITCODE -ne 0) { throw 'Python 3.12 launcher not available' }
      - name: Create source payload
        run: python packaging/desktop/build_bundle.py
      - name: Build Inno Setup EXE
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --version=6.4.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          & $iscc packaging/desktop/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
      - name: Install release EXE
        shell: pwsh
        run: |
          $target = "$env:RUNNER_TEMP\Resistor Calculator 3.0.0"
          $exe = Resolve-Path dist/ResistorCalculator-3.0.0-windows-x86_64-setup.exe
          $result = Start-Process -FilePath $exe -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$target`"", "/LOG=`"$env:RUNNER_TEMP\resistor-setup.log`"") -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer failed: $($result.ExitCode)" }
          if (!(Test-Path "$target\runtime\resistor-calculator-install.json")) { throw 'Runtime installation missing' }
      - name: Test installed application offscreen
        shell: pwsh
        run: |
          $target = "$env:RUNNER_TEMP\Resistor Calculator 3.0.0"
          $env:RESISTOR_SOURCE = "$target\runtime\resistanceCalculator.py"
          & "$target\runtime\.venv\Scripts\python.exe" -m unittest discover -s tests -p 'test_desktop.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Installed application tests failed' }
      - name: Test Windows uninstaller
        shell: pwsh
        run: |
          $target = "$env:RUNNER_TEMP\Resistor Calculator 3.0.0"
          $result = Start-Process "$target\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw 'Uninstaller failed' }
          if (Test-Path "$target\runtime") { throw 'Runtime was not removed' }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-installer
          path: dist/ResistorCalculator-3.0.0-windows-x86_64-setup.exe
          if-no-files-found: error
